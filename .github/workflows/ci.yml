name: catalogue-and-ranking-checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate_catalogue.py
      - run: python scripts/validate_aircall_pack.py
      - run: python scripts/evidence_triage.py
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-triage
          path: reports/evidence_triage.csv
